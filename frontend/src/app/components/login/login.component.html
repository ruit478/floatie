<!-- frontend/src/app/components/login/login.component.html -->
<div class="login-container">
  <div class="pixel-card">
    <!-- Header -->
    <div class="pixel-header">
      <div class="pixel-icon" aria-hidden="true">🐱</div>
      <h1 class="pixel-title">FLOATIE</h1>
      <div class="pixel-divider" aria-hidden="true"></div>
      <p class="pixel-subtitle">LOGIN TO YOUR PET</p>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form" novalidate>
      <!-- Username Field -->
      <div class="form-group">
        <label for="username" class="pixel-label">
          <span class="label-icon" aria-hidden="true">👤</span>
          USERNAME
        </label>
        <input
          type="text"
          id="username"
          name="username"
          formControlName="username"
          class="pixel-input"
          [class.error]="isFieldInvalid('username')"
          [attr.aria-invalid]="isFieldInvalid('username')"
          [attr.aria-describedby]="getFieldErrorId('username')"
          placeholder="ENTER USERNAME"
          autocomplete="username"
          required
        />
        <field-error
          [control]="loginForm.get('username')!"
          [id]="getFieldErrorId('username')"
        />
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password" class="pixel-label">
          <span class="label-icon" aria-hidden="true">🔒</span>
          PASSWORD
        </label>
        <input
          type="password"
          id="password"
          name="password"
          formControlName="password"
          class="pixel-input"
          [class.error]="isFieldInvalid('password')"
          [attr.aria-invalid]="isFieldInvalid('password')"
          [attr.aria-describedby]="getFieldErrorId('password')"
          placeholder="ENTER PASSWORD"
          autocomplete="current-password"
          required
        />
        <field-error
          [control]="loginForm.get('password')!"
          [id]="getFieldErrorId('password')"
        />
      </div>

      <!-- Global Error Message -->
      @if (loginState().error) {
        <div class="global-error" role="alert" aria-live="polite">
          <span class="error-icon" aria-hidden="true">❗</span>
          {{ loginState().error }}
        </div>
      }

      <!-- Submit Button -->
      <button
        type="submit"
        class="pixel-button pixel-button-primary"
        [disabled]="loginForm.invalid || loginState().loading"
        [attr.aria-busy]="loginState().loading"
      >
        @if (!loginState().loading) {
          <span>▶ LOGIN</span>
        } @else {
          <span class="loading-spinner">
            <span class="sr-only">Processing login request</span>
            ◐ LOADING...
          </span>
        }
      </button>

      <!-- Footer Links -->
      <div class="pixel-footer">
        <p>NEW HERE? <a routerLink="/register" class="pixel-link" tabindex="0">CREATE ACCOUNT</a></p>
        <p class="demo-hint">DEMO: username: "test" / password: "test123"</p>
      </div>
    </form>
  </div>
</div>
