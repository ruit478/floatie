<div class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="death-modal-title" (keydown)="onKeydown($event)">
  <div class="modal-card">
    <h2 id="death-modal-title" class="modal-title">Your pet has passed away…</h2>
    <p class="modal-body">
      Despite your best efforts, your beloved companion has moved on to the great pixel beyond.
    </p>
    <div class="modal-actions">
      <button #firstBtn type="button" class="modal-btn primary" (click)="replace.emit()">
        Generate new pet
      </button>
      <button type="button" class="modal-btn danger" (click)="deleteAccount.emit()">
        Delete account
      </button>
    </div>
  </div>
</div>
