server.port=8080
spring.application.name=floatie-backend

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:floatie}
spring.datasource.username=${DB_USER:floatie}
spring.datasource.password=${DB_PASSWORD:floatie123}
spring.jpa.hibernate.ddl-auto=update

# JWT
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# File uploads
app.uploads.directory=${UPLOADS_DIR:./backend/sprites}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Pet mechanics stat decay per real hour
app.pet.hunger-decay=2.0
app.pet.happiness-decay=1.5
app.pet.energy-decay=1.0
app.pet.hygiene-decay=1.0
app.pet.health-decay-critical=3.0
app.pet.health-decay-low=1.0

# Pet mechanics time multiplier (1.0 = real time, 60.0 = 1 game hour per real minute)
app.pet.time-multiplier=1.0

# Pet mechanics XP and bond rewards per action
app.pet.xp-feed=10
app.pet.xp-play=15
app.pet.xp-rest=5
app.pet.xp-clean=5
app.pet.xp-heal=5
app.pet.bond-feed=1
app.pet.bond-play=2
app.pet.bond-clean=1
app.pet.bond-heal=1

# Pet mechanics XP needed per level: level * xp-per-level
app.pet.xp-per-level=150

# Pet mechanics life stage age thresholds (days): EGG,BABY,CHILD,TEEN,ADULT,ELDER
app.pet.stage-thresholds=0,2,5,11,21,61

# Pet mechanics levels at which evolution triggers (comma-separated)
app.pet.evolution-levels=5,10,20

# Logging
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr(%5p) %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n